name: Stable CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check

  gate:
    name: Stable CI Gate
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform tests
        run: test '${{ needs.test.result }}' = 'success'
